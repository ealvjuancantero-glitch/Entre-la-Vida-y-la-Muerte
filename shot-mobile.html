<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Captura móvil</title>
  <style>
    html, body { margin: 0; background: #0B0A18; }
    iframe { display: block; width: 390px; height: 844px; border: 0; }
  </style>
</head>
<body>
  <iframe id="f" src="index.html"></iframe>
  <script>
    var f = document.getElementById("f");
    f.addEventListener("load", function () {
      var d = f.contentDocument;
      var w = f.contentWindow;
      var id = location.hash.replace("#", "") || "inicio";
      var el = d.getElementById(id);

      var style = d.createElement("style");
      style.textContent = ".reveal{opacity:1!important;transform:none!important}";
      d.head.appendChild(style);

      if (el) {
        var y = el.getBoundingClientRect().top + w.scrollY - 80;
        w.scrollTo(0, y);
      }
    });
  </script>
</body>
</html>
